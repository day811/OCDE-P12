id: gen_activities
namespace: sds.infra
description: Pipeline de génération d'activités et export multi-canal

inputs:
  - id: num_rows
    type: INT
    defaults: 2
    description: "Number of activities to generate"

  - id: target
    type: SELECT
    defaults: LOCAL
    values: [GSHEET, LOCAL]
    description: "Send to Google Sheet or LOCAL Google Scannin"

  - id: start_date
    type: STRING
    defaults: 'None'
    description: "Leave None or enter yyyy-mm-dd to overwrite default"

variables:
  script_path: /app/scripts/
  employees_sport: /app/data/sources/Données+Sportive.xlsx
  xl_sports_file: /app/data/sources/strava_sports.xlsx
  xl_locations_file: /app/data/sources/locations.xlsx


tasks:
  - id: generate
    type: io.kestra.plugin.scripts.python.Commands
    description: "Génération des activités sportives"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env: 
      START_DATE: "{{ inputs.start_date != 'None' ? inputs.start_date : envs.start_date}}"
      CRYPT_KEY: "{{ secret('CRYPT_KEY') }}"
    commands:
      - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
      - python -c "from gen_activities import run_generation; run_generation('{{ vars.employees_sport }}', 'fake_activities.xlsx', '{{ vars.xl_sports_file }}', '{{ vars.xl_locations_file }}', {{ inputs.num_rows }})"
    outputFiles:
      - "fake_activities.xlsx"

  - id: case_dest
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ inputs.target }}"
    cases: 
      LOCAL:
        - id: log_nothing
          type: io.kestra.plugin.core.log.Log
          message: "Rien à faire, arrêt propre du flow."

      GSHEET:
        - id: export_gsheet
          type: io.kestra.plugin.googleworkspace.sheets.Load
          description: "Export vers Google Sheets via Plugin"
          #format: parquet
          #from: "{{outputs.generate.outputFiles['activities.xlsx']}}"
          spreadsheetId: "{{ secret('GSHEET_ID') }}"
          range: "Feuille1!A1"
          serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
          # Note: Le plugin gère la conversion Parquet -> Sheet automatiquement

  - id: log_final
    type: io.kestra.plugin.core.log.Log
    message: |
      ════════════════════════════════════════════════════════════
      🚀 GENERATION COMPLETED
      ════════════════════════════════════════════════════════════
      📈 Fichier généré demandé : 'fake_activities.xlsx'
         Taille des enrgeistrements : {{ outputs.generate.vars.shape}}
