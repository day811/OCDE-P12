id: ingest_activities
namespace: sds.infra
description: Ingestion pipeline of Google Sheet Data in postgreSQL DB

inputs:
  - id: simple_comments
    type: BOOL
    defaults: false
    description: DO NOT use RAG to generate comment


variables:
  script_path: /app/scripts/
  xl_sports_file: /app/data/sources/strava_sports.xlsx


tasks:
  - id: start
    type: io.kestra.plugin.core.debug.Return
    format: "\"{{ taskrun.startDate }}\""

  - id: load_sheet
    type: io.kestra.plugin.googleworkspace.sheets.Read
    description: "Laod Google Sheet in ION"
    dateTimeRender: FORMATTED_STRING
    spreadsheetId: "{{ secret('GSHEET_ID') }}"
    store: true
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
    allowFailure: true
    retry:
      type: constant
      maxAttempt: 3
      maxDuration: PT30S
      interval: PT15S

  - id: convert_to_xlsx
    type: io.kestra.plugin.serdes.excel.IonToExcel
    description: "Convert ION downloaded to xlsc"
    from: "{{ outputs.load_sheet['uris']['Activities'] }}"
    runIf: "{{ tasks.load_sheet.state == 'SUCCESS'}}" 
    allowFailure: true
    
  - id: convert_to_xlsx_status
    type: io.kestra.plugin.core.debug.Return
    format: "{{ tasks.convert_to_xlsx.state != 'SKIPPED' ? 'SUCCESS' : 'FAILED'  }}"


  - id: validate_incoming
    type: io.kestra.plugin.scripts.python.Commands
    description: "Check and clean incoming data with gX "
    runIf: "{{ outputs.convert_to_xlsx_status.value == 'SUCCESS'}}"
    allowFailure: true
    env:
      CRYPT_KEY: "{{ secret('CRYPT_KEY') }}"
      DB_CONNECTION_STRING: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/sport_app_db
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
      - python -c 'from activity_worker import validate_incoming; validate_incoming("{{ outputs.convert_to_xlsx.uri}}", "activities_income.parquet")'
    outputFiles:
      - "activities_income.parquet"

  - id: validate_incomings_status
    type: io.kestra.plugin.core.debug.Return
    format: "{{ tasks.validate_incoming.state != 'SKIPPED' ? outputs.validate_incoming.vars.status : 'FAILED'  }}"

  - id: fingerprint_activities
    type: io.kestra.plugin.scripts.python.Commands
    description: "Compute incoming data fingerprints "
    runIf: "{{ outputs.validate_incomings_status.value != 'FAILED'}}"
    allowFailure: true
    disabled: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
      - python -c 'from activity_worker import fingerprint_activities; fingerprint_activities("{{ outputs.validate_incoming.outputFiles['activities_income.parquet'] }}", "activities_fingerprint.parquet")'
    outputFiles:
      - "activities_fingerprint.parquet"

  - id: fingerprint_activities_status
    type: io.kestra.plugin.core.debug.Return
    format: "{{ tasks.fingerprint_activities.state != 'SKIPPED' ? outputs.fingerprint_activities.vars.status : 'FAILED'  }}"

  - id: scan_new_activities
    type: io.kestra.plugin.scripts.python.Commands
    description: "Compare fingerprints with pg data and store an action file"
    runIf: "{{ outputs.fingerprint_activities_status.value == 'SUCCESS'}}"
    allowFailure: true
    disabled: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CRYPT_KEY: "{{ secret('CRYPT_KEY') }}"
      DB_CONNECTION_STRING: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/sport_app_db
    commands:
      - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
      - python -c 'from activity_worker import scan_new_activities; scan_new_activities( "{{outputs.fingerprint_activities.outputFiles['activities_fingerprint.parquet'] }}", "activities_actions.parquet")'
    outputFiles:
      - "activities_actions.parquet"
    
  - id: scan_new_activities_status
    type: io.kestra.plugin.core.debug.Return
    format: "{{ tasks.scan_new_activities.state == 'SKIPPED' ? 'FAILED' : (outputs.scan_new_activities.vars.status == 'WARNING' or outputs.validate_incoming.vars.status == 'WARNING') ? 'WARNING' : 'SUCCESS' }}"

  - id: must_continue
    type: io.kestra.plugin.core.flow.Switch
    description: "Check if scanner found actions to make"
    value: "{{ outputs.scan_new_activities.vars.continue }}"
    runIf: "{{ outputs.scan_new_activities_status.value != 'FAILED'}}"
    cases:
      YES:
      - id: process_actions
        type: io.kestra.plugin.core.flow.Sequential
        description: "Generate comments for new and modified activities"
        tasks:
        - id: comment_activities
          type: io.kestra.plugin.scripts.python.Commands
          description: "Incoming activities commenting"
          allowFailure: true
          env:
            SIMPLE_COMMENTS: "{{ inputs.simple_comments }}" # Do NOT generate comments with RAG
            CRYPT_KEY: "{{ secret('CRYPT_KEY') }}"
            DB_CONNECTION_STRING: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/sport_app_db
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c 'from activity_worker import comment_activities; comment_activities("{{outputs.scan_new_activities.outputFiles['activities_actions.parquet'] }}", "activities_commented.parquet", "{{ vars.xl_sports_file }}")'
          outputFiles:
            - "activities_commented.parquet"

        - id: comment_activities_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.comment_activities.state != 'SKIPPED' ? outputs.comment_activities.vars.status : 'FAILED'  }}"

        - id: load_pg
          type: io.kestra.plugin.scripts.python.Commands
          description: "Make update to PostgreSQL DB"
          allowFailure: true
          runIf: "{{ outputs.comment_activities_status.value == 'SUCCESS'}}"
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          env:
            MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
            CRYPT_KEY: "{{ secret('CRYPT_KEY') }}"
            DB_CONNECTION_STRING: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/sport_app_db
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c 'from activity_worker import load_pg; load_pg("{{outputs.comment_activities.outputFiles['activities_commented.parquet'] }}")'
        - id: load_pg_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.load_pg.state != 'SKIPPED' ? outputs.load_pg.vars.status : 'FAILED'  }}"

        - id: log_final_log
          type: io.kestra.plugin.core.log.Log
          message: |
            Google Sheet Download : 

      NO:
      - id: log_nothing
        type: io.kestra.plugin.core.log.Log
        message: "Rien à faire, arrêt propre du flow."

  - id: duration_calc 
    type: io.kestra.plugin.scripts.python.Script
    description: Execution time calculation
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      fin = "{{ taskrun.startDate }}"
      from datetime import datetime
      from kestra import Kestra

      deb = {{ outputs.start.value }}
      print(f"deb : {deb}") 
      print(f"fin : {fin}")       
      dt_deb = datetime.fromisoformat(deb.replace("Z", "+00:00"))
      dt_fin = datetime.fromisoformat(fin.replace("Z", "+00:00"))
      delta = dt_fin - dt_deb
      Kestra.outputs( { 'total_time' : delta.total_seconds(), 'start' : str(dt_deb)})

  - id: final_status
    type: io.kestra.plugin.core.debug.Return
    format: "{{ outputs.scan_new_activities_status.value == 'FAILED'  ? 'FAILED' :  outputs.scan_new_activities.vars.continue == 'NO' ? outputs.scan_new_activities_status.value :  outputs.load_pg_status.value == 'FAILED' ? 'FAILED': (outputs.load_pg_status.value == 'WARNING' or outputs.scan_new_activities_status.value == 'WARNING') ? 'WARNING' :'SUCCESS'}}"

  - id: final_log_txt
    type: io.kestra.plugin.core.debug.Return
    format: |
      -
      ════════════════════════════════════════════════════════════
      📊📊📊📊 ACTIVITIES INGESTION PIPELINE EXECUTION RESULT : {{ outputs.final_status.value }} 📊📊📊📊
      ════════════════════════════════════════════════════════════&nbsp;  
      📅 Start time     : {{ outputs.duration_calc.vars.start }}  
      ⌛ Duration       : {{ outputs.duration_calc.vars.total_time }} sec  
      &nbsp;  
      ════════════════════════════════════════════════════════════&nbsp;  
      💪💪💪💪  ACTIVITIES GSHEET LOAD AND ANALYSIS : {{ outputs.scan_new_activities_status.value }} 💪💪💪💪    
      ════════════════════════════════════════════════════════════&nbsp;  
      💪 Activities GSheet loading : {{ tasks.load_sheet.state }} : {{ outputs.load_sheet.size }} rows    
      {% if tasks.load_sheet.state != 'FAILED' %}  
      &nbsp;
      💪 Activities xlsx saving : {{ outputs.convert_to_xlsx_status.value }} : {{ outputs.convert_to_xlsx.size }}   
      {% endif %} 
      &nbsp;
      {% if outputs.convert_to_xlsx_status.value != 'FAILED' %} 
      💪 Activities xlsx validation : {{ outputs.validate_incoming.vars.result }} - {{ outputs.validate_incoming.vars.shape }}
      {{ outputs.validate_incoming.vars.detail }}  
      {% endif %}  
      {% if outputs.validate_incomings_status.value != 'FAILED' %} 
      💪 Activities xlsx fingerprinting : {{ outputs.fingerprint_activities.vars.result }} - {{ outputs.fingerprint_activities.vars.shape }}
      {% endif %}  
      {% if outputs.fingerprint_activities_status.value != 'FAILED' %} 
      &nbsp;
      💪 Activities xlsx scanning : {{ outputs.scan_new_activities.vars.result }} - {{ outputs.scan_new_activities.vars.shape }}
      {{ outputs.scan_new_activities.vars.detail }}  
      Must continue : {{ outputs.scan_new_activities.vars.continue }}
      &nbsp;  
      {% endif %}  
      &nbsp;  
      {% if outputs.scan_new_activities.vars.status != 'FAILED' and outputs.scan_new_activities.vars.continue == 'NO' %}
      No actions to database 
      {% else %}
      ════════════════════════════════════════════════════════════&nbsp;  
      💪💪💪💪  ACTION CHANGES TO DB  : {{ outputs.load_pg_status.value }} 💪💪💪💪   
      ════════════════════════════════════════════════════════════&nbsp;  
      💪 Comment new and changed Activities : {{ outputs.comment_activities.vars.result }} : {{ outputs.comment_activities.vars.shape }} rows    
      {% if tasks.load_sheet.state != 'FAILED' %}  
      &nbsp;
      💪 Activities to db : {{ outputs.load_pg.vars.result }} : {{ outputs.load_pg.vars.shape }}
      &nbsp;  
       {{ outputs.load_pg.vars.detail }}  
      {% endif %} 
      {% endif %} 

  - id: send_alert
    type: io.kestra.plugin.core.flow.Subflow
    flowId: notify_error
    namespace: sds.infra
    runIf: "{{ outputs.final_status.value != 'SUCCESS' }} "
    inputs:
      test: false
      message: "{{outputs.final_log_txt.value}}"
      status: "{{ outputs.final_status.value }}"

  - id: log_final
    type: io.kestra.plugin.core.log.Log
    description: Final Log
    message: "{{ outputs.final_log_txt.value }}"

  - id: set_final_status
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.final_status.value =='FAILED'}}"


