id: ingest
namespace: sds.infra
description: Full pipeline for ingesting HR data
variables:
  employees_data: /app/data/sources/Données+RH.xlsx
  pg_cnx_str: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@{{ envs.SDS_DB}}:5432
  script_path: /app/scripts/
  req_modules: "pandas openpyxl sqlalchemy fastparquet great-expectations geopy psycopg2-binary"

tasks:
  - id: start
    type: io.kestra.plugin.core.debug.Return
    format: "\"{{ taskrun.startDate }}\""

  - id: load_rh
    type: io.kestra.plugin.scripts.python.Commands
    description: "Load RH data from Excel with retry"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    retry:
      type: constant
      maxAttempt: 3
      maxDuration: PT5M
      interval: PT15S
    env:
      DB_CONNECTION_STRING: "{{ vars.pg_cnx_str }}"
      PIP_ROOT_USER_ACTION: ignore
    beforeCommands:
      - pip install {{ vars.req_modules }}
    commands:
      # On ajoute le dossier au PYTHONPATH pour permettre l'import
      - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
      - python -c "from ingest_hr import run_load; run_load('{{ vars.employees_data }}', 'rh_raw.parquet')"
    outputFiles:
      - "rh_raw.parquet"