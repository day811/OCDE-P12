id: test
namespace: null

tasks:
    # --- PHASE 3 : STARTING SPARK ---
  - id: start_spark_streaming
    type: io.kestra.plugin.spark.SparkCLI
    containerImage: apache/spark:3.5.3  # On force l'image officielle ici
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
    commands:
      - /opt/spark/bin/spark-submit 
        --master spark://spark-master:7077 
        --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
        process_data.py
    inputFiles:
      process_data.py: |
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import from_json, col
        from pyspark.sql.types import StructType, StructField, StringType, IntegerType, TimestampType

        spark = SparkSession.builder \
            .appName("MultiTableDebeziumToDelta") \
            .config("spark.sql.extensions", "io.delta.sql.DeltaSparkSessionExtension") \
            .config("spark.sql.catalog.spark_catalog", "org.apache.spark.sql.delta.catalog.DeltaCatalog") \
            .getOrCreate()

        def process_table(topic_name, table_name, schema):
            # Lecture du flux
            df = spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", "redpanda:9092") \
                .option("subscribe", topic_name) \
                .option("startingOffsets", "earliest") \
                .load()

            # Extraction des données 'after' (données après modification)
            parsed_df = df.selectExpr("CAST(value AS STRING)") \
                .select(from_json(col("value"), schema).alias("data")) \
                .select("data.payload.after.*")

            # Écriture vers Delta Lake
            return parsed_df.writeStream \
                .format("delta") \
                .outputMode("append") \
                .option("checkpointLocation", f"/opt/spark/data/checkpoints/{table_name}") \
                .start(f"/opt/spark/data/delta/{table_name}")

        # --- SCHÉMAS ---
        # Schéma pour Employees
        schema_employees = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id", IntegerType()),
                    StructField("name", StringType()),
                    StructField("role", StringType())
                ]))
            ]))
        ])

        # Schéma pour Sports Activities
        schema_activities = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id", IntegerType()),
                    StructField("employee_id", IntegerType()),
                    StructField("activity_type", StringType()),
                    StructField("duration_minutes", IntegerType())
                ]))
            ]))
        ])

        # --- LANCEMENT DES FLUX ---
        q1 = process_table("cdc.public.employees", "employees", schema_employees)
        q2 = process_table("cdc.public.sports_activities", "activities", schema_activities)

        # Attendre que les deux flux se terminent (ils tournent indéfiniment)
        spark.streams.awaitAnyTermination()