id: test
namespace: sds.infra

inputs:
  - id: run_task
    type: BOOLEAN
    defaults: true
  - id: sometext
    type: STRING
    defaults: Some Text

tasks:
  - id: main
    type: io.kestra.plugin.core.debug.Return
    format: |
      {% if 2>1 %} inputs.sometext {% endif %}
    runIf: "{{ inputs.run_task }}"

  - id: fallback
    type: io.kestra.plugin.core.debug.Return
    format: fallback output

outputs:
  - id: flow_output
    type: STRING
    value: "{{ tasks.main.state != 'SKIPPED' ? outputs.main.value : outputs.fallback.value }}"