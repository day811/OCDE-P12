id: test
namespace: sds.infra

inputs:
  - id: file
    type: FILE
    required: false
  - id: serviceAccount
    type: STRING
    required: false
    
tasks:
  - id: load_data
    type: io.kestra.plugin.googleworkspace.sheets.Read
    dateTimeRender: SERIAL_NUMBER
    spreadsheetId: "{{ secret('GSHEET_ID') }}"
    store: true
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"