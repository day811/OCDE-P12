id: notify_error
namespace: sds.infra
description: "Centralisation des alertes pour le namespace"
inputs:
  - id: message
    type: STRING
    required: true
    defaults: "Sample text message to send"
    description: "Message to send"
  
  - id: test
    type: BOOL
    defaults: true
    description: "Send message to log"

  - id : status
    type: STRING
    defaults: WARNING



tasks:


  - id: check_test
    type: io.kestra.plugin.core.flow.If
    condition : "{{ inputs.test }}"
    then :
      - id: log_final
        type: io.kestra.plugin.core.log.Log
        message: |
          {{ inputs.status }} **ALERT MESSAGE : Abnormal termination of flow : {{ inputs.status }}**
          &nbsp;
          {{ inputs.message }}
    else:
      - id: slack_txt
        type: io.kestra.plugin.core.debug.Return
        format: '{{ inputs.message | replace({"&nbsp;": " "}) }}'

      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_ADMIN_WEBHOOK')}}"
        messageText: "{{ outputs.slack_txt.value }}"
