id: ingest_rh_data
namespace: sds.infra
description: "Pipeline Ingestion RH avec Qualité"

variables:
  sourceRH: /app/data/sources/Données+RH.xlsx

tasks:
  - id: create_table
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://postgres:5432/rh_db"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      CREATE TABLE IF NOT EXISTS employees (
          id_salarie INT PRIMARY KEY,
          nom VARCHAR(100),
          prenom VARCHAR(100),
          date_naissance DATE,
          bu VARCHAR(50),
          date_embauche DATE,
          salaire_brut FLOAT,
          type_contrat VARCHAR(20),
          cp_restants INT,
          adresse_domicile TEXT,
          moyen_de_deplacement VARCHAR(100)
      );

  - id: upload_csv
    type: io.kestra.plugin.jdbc.postgresql.CopyIn
    url: "jdbc:postgresql://postgres:5432/rh_db"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    from: "{{ vars.sourceRH }}"
    table: "employees"
    format: CSV
    header: true
    delimiter: ","

  - id: quality_check_gx
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install great_expectations psycopg2-binary
    commands:
      - python script_gx.py
    inputFiles:
      script_gx.py: |
        import great_expectations as gx
        import sys

        # Connexion à Postgres
        context = gx.get_context()
        datasource = context.sources.add_postgres(
            name="my_postgres", 
            connection_string="postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/rh_db"
        )
        asset = datasource.add_table_asset(name="employees_table", table_name="employees")
        
        # Définition des attentes (Expectations)
        request = asset.build_batch_request()
        validator = context.get_validator(batch_request=request, create_expectation_suite_with_name="rh_suite")
        
        validator.expect_column_values_to_be_between("salaire_brut", min_value=1500)
        validator.expect_column_values_to_not_be_null("id_salarie")
        validator.expect_column_values_to_match_regex("moyen_de_deplacement", r"(?i)Vélo|Marche|Running|Voiture|Transports")
        
        # Validation
        result = validator.validate()
        if not result["success"]:
            print("❌ Erreur de qualité de données détectée !")
            sys.exit(1) # Fait échouer la tâche Kestra
        print("✅ Qualité des données validée.")

inputs:
  - id: file
    type: FILE