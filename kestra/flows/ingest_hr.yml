id: ingest_hr
namespace: sds.infra
description: Full pipeline for ingesting HR and sport data

variables:
  employees_data: /app/data/sources/Données+RH.xlsx
  employees_sport: /app/data/sources/Données+Sportive.xlsx
  xl_sports_file: /app/data/sources/strava_sports.xlsx
  script_path: /app/scripts/

tasks:
  - id: start
    type: io.kestra.plugin.core.debug.Return
    format: "\"{{ taskrun.startDate }}\""

  - id: hr_sport_files
    type: io.kestra.plugin.core.flow.Parallel
    description: ET Files in parallel
    allowFailure: true
    tasks:
      - id: et_hr
        type: io.kestra.plugin.core.flow.Sequential
        description: "ERP extract → transform  validate"
        allowFailure: true

        tasks:
        - id: extract_hr
          type: io.kestra.plugin.scripts.python.Commands
          description: "Load RH data from Excel with retry"
          allowFailure: true
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          retry:
            type: constant
            maxAttempt: 3
            maxDuration: PT30S
            interval: PT5S
          env:
            CRYPT_KEY: "{{ secret('CRYPT_KEY')}}"
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c "from ingest_hr import load_hr_xlsx; load_hr_xlsx('{{ vars.employees_data }}', 'hr_raw.parquet')"
          outputFiles:
            - "hr_raw.parquet"

        - id: transform_hr
          type: io.kestra.plugin.scripts.python.Commands
          description: " RH data treatment"
          allowFailure: true
          runIf: "{{ outputs.extract_hr.vars.status != 'CRITICAL' }}"
          env:
            GOOGLE_MAPS_KEY: "{{ secret('GOOGLE_MAPS_KEY') }}"
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c """from ingest_hr import transform_hr; transform_hr('{{ outputs.extract_hr.outputFiles["hr_raw.parquet"] }}', 'hr_processed.parquet')"""
          outputFiles:
            - "hr_processed.parquet"

        - id: transform_hr_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.transform_hr.state != 'SKIPPED' ? outputs.transform_hr.vars.status : 'CRITICAL'  }}"

        - id: validate_hr
          type: io.kestra.plugin.scripts.python.Commands
          description: " Sport data validation"
          allowFailure: true
          runIf: "{{ outputs.transform_hr_status.value != 'CRITICAL' }}"
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c """from ingest_hr import validate_hr; validate_hr('{{ outputs.transform_hr.outputFiles["hr_processed.parquet"] }}')"""

        - id: validate_hr_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.validate_hr.state != 'SKIPPED' ? outputs.validate_hr.vars.status : 'CRITICAL'  }}"

      - id: et_sport
        type: io.kestra.plugin.core.flow.Sequential
        description: "ERP extract → clean → dedup → validate"
        tasks:

        - id: extract_sport
          type: io.kestra.plugin.scripts.python.Commands
          description: "Load Sport data from Excel with retry"
          allowFailure: true
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          retry:
            type: constant
            maxAttempt: 3
            maxDuration: PT5M
            interval: PT15S
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c "from ingest_hr import load_sport_xlsx; load_sport_xlsx('{{ vars.employees_sport }}', 'sport_raw.parquet')"
          outputFiles:
            - "sport_raw.parquet"

        - id: transform_sport
          type: io.kestra.plugin.scripts.python.Commands
          description: " Sport data transform"
          allowFailure: true
          runIf: "{{ outputs.extract_sport.vars.status != 'CRITICAL' }}"
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c """from ingest_hr import transform_sport; transform_sport('{{ outputs.extract_sport.outputFiles["sport_raw.parquet"] }}', 'sport_processed.parquet', '{{ vars.xl_sports_file}}')"""
          outputFiles:
            - "sport_processed.parquet"

        - id: transform_sport_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.transform_sport.state != 'SKIPPED' ? outputs.transform_sport.vars.status : 'CRITICAL'  }}"

        - id: validate_sport
          type: io.kestra.plugin.scripts.python.Commands
          description: " Sport data validation"
          allowFailure: true
          runIf: "{{ outputs.transform_sport_status.value != 'CRITICAL' }}"
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
            - python -c """from ingest_hr import validate_sport; validate_sport('{{ outputs.transform_sport.outputFiles["sport_processed.parquet"] }}', '{{ vars.xl_sports_file}}')"""

        - id: validate_sport_status
          type: io.kestra.plugin.core.debug.Return
          format: "{{ tasks.validate_sport.state != 'SKIPPED' ? outputs.validate_sport.vars.status : 'CRITICAL'  }}"


  - id: merge_flow
    type: io.kestra.plugin.core.flow.Sequential
    description: "ERP extract → clean → dedup → validate"
    allowFailure: true
    tasks:
      - id: merge_hr_sport
        type: io.kestra.plugin.scripts.python.Commands
        description: " RH data treatment"
        allowFailure: true
        runIf: "{{ outputs.validate_sport_status.value != 'CRITICAL' and outputs.validate_hr_status.value != 'CRITICAL' }}"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
          - python -c """from ingest_hr import merge_hr_sport; merge_hr_sport('{{ outputs.transform_hr.outputFiles["hr_processed.parquet"] }}', '{{ outputs.transform_sport.outputFiles["sport_processed.parquet"] }}', 'merge.parquet')"""
        outputFiles:
          - "merge.parquet"

      - id: merge_status
        type: io.kestra.plugin.core.debug.Return
        format: "{{ tasks.merge_hr_sport.state != 'SKIPPED' ? outputs.merge_hr_sport.vars.status : 'CRITICAL'  }}"


      - id: validate_merge
        type: io.kestra.plugin.scripts.python.Commands
        description: " Sport data validation"
        warningOnStdErr: false
        allowFailure: true
        runIf: "{{ outputs.merge_hr_sport.vars.status != 'CRITICAL' }}"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
          - python -c """from ingest_hr import validate_merge; validate_merge('{{ outputs.transform_hr.outputFiles["hr_processed.parquet"] }}', '{{ outputs.transform_sport.outputFiles["sport_processed.parquet"] }}', '{{ outputs.merge_hr_sport.outputFiles["merge.parquet"] }}')"""

      - id: validate_merge_status
        type: io.kestra.plugin.core.debug.Return
        format: "{{ tasks.validate_merge.state != 'SKIPPED' ? outputs.validate_merge.vars.status : 'CRITICAL'  }}"

      - id: merge_to_pg
        type: io.kestra.plugin.scripts.python.Commands
        description: " Sport data validation"
        warningOnStdErr: false
        allowFailure: true
        runIf: "{{ outputs.validate_merge_status.value != 'CRITICAL'}}"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
         DB_CONNECTION_STRING: postgresql://{{ secret('POSTGRES_USER') }}:{{ secret('POSTGRES_PASSWORD') }}@postgres:5432/sport_app_db
        commands:
          - export PYTHONPATH=$PYTHONPATH:{{vars.script_path}}
          - python -c """from ingest_hr import load_pg; load_pg('{{ outputs.merge_hr_sport.outputFiles["merge.parquet"] }}')"""

      - id: merge_to_pg_status
        type: io.kestra.plugin.core.debug.Return
        format: "{{ tasks.merge_to_pg.state != 'SKIPPED' ? outputs.merge_to_pg.vars.status : 'CRITICAL'  }}"

  - id: final_status
    type: io.kestra.plugin.core.debug.Return
    format: |
      {{ tasks.merge_to_pg_status.state == 'SKIPPED' ? 'CRITICAL' : ((outputs.validate_hr_status.value == 'WARNING' or outputs.validate_sport_status.value == 'WARNING' or outputs.validate_merge_status.value == 'WARNING') ? 'WARNING' : 'SUCCESS')  }}

  - id: duration_calc 
    type: io.kestra.plugin.scripts.python.Script
    description: Execution time calculation

    script: |
      fin = "{{ taskrun.startDate }}"

      from datetime import datetime
      from kestra import Kestra

      deb = {{ outputs.start.value }}
      print(f"deb : {deb}") 
      print(f"fin : {fin}")       

      dt_deb = datetime.fromisoformat(deb.replace("Z", "+00:00"))
      dt_fin = datetime.fromisoformat(fin.replace("Z", "+00:00"))

      delta = dt_fin - dt_deb
      Kestra.outputs( { 'total_time' : delta.total_seconds(), 'start' : str(dt_deb)})

  - id: final_log_txt
    type: io.kestra.plugin.core.debug.Return
    format: |
      -
      ════════════════════════════════════════════════════════════
      📊              PIPELINE EXECUTION {{ outputs.final_status.value }} &nbsp;
      &nbsp;  
      ════════════════════════════════════════════════════════════&nbsp;  
      📅 Start time     : {{ outputs.duration_calc.vars.start }}  
      ⌛ Duration       : {{ outputs.duration_calc.vars.total_time }} sec  
      🧭 Geo location   : {{ outputs.transform_hr["vars"]["geoloc"] }} 
      &nbsp;  
      &nbsp;  
      ════════════════════════════════════════════════════════════&nbsp;  
                       EMPLOYEE PIPELINE {{ outputs.validate_hr.vars.result }}
      ════════════════════════════════════════════════════════════&nbsp;  
      👷 Employees xlsx loading : {{ outputs.extract_hr.vars.result }} : {{ outputs.extract_hr.vars.shape }}   
      {{ outputs.extract_hr.vars.detail }}  
      {% if outputs.extract_hr.vars.status != 'CRITICAL' %}  
      &nbsp;
      👷 Employees xlsx transforming : {{ outputs.transform_hr.vars.result }} : {{ outputs.transform_hr.vars.shape }}   
      {{ outputs.transform_hr.vars.detail }} 
      {% endif %} 
      {% if outputs.transform_hr_status.value != 'CRITICAL' %} 
      👷 Employees xlsx validation : {{ outputs.validate_hr.vars.result }}  
      {{ outputs.validate_hr.vars.detail }}  
      {% endif %}  
      &nbsp;
      &nbsp;
      ════════════════════════════════════════════════════════════&nbsp;  
                       sport PIPELINE {{ outputs.validate_sport.vars.result }}
      ════════════════════════════════════════════════════════════
      🏀 Sportive xlsx loading : {{ outputs.extract_sport.vars.result }} : {{ outputs.extract_sport.vars.shape }}  &nbsp;
      &nbsp;   
      {% if outputs.extract_sport.vars.status != 'CRITICAL' %}     
      🏀 Sportive xlsx transforming : {{ outputs.transform_sport.vars.result }} : {{ outputs.transform_sport.vars.shape }}  
      {{ outputs.transform_sport.vars.detail }}    
      {% endif %}  
      {% if outputs.transform_sport_status.value != 'CRITICAL' %}    
      🏀 Sportive xlsx validation : {{ outputs.validate_sport.vars.result }}  
      {{ outputs.validate_sport.vars.detail }}    
      {% endif %}  
      &nbsp;
      &nbsp; {% if (outputs.validate_sport_status.value != 'CRITICAL' and outputs.validate_hr_status.value != 'CRITICAL' )  %} 
      ════════════════════════════════════════════════════════════&nbsp;  
                       MERGE PIPELINE {{ outputs.validate_MERGE.vars.result }}
      ════════════════════════════════════════════════════════════
      🔁 Employees and Sportive merging : {{ outputs.merge_hr_sport.vars.result }} : {{ outputs.merge_hr_sport.vars.shape }}  
      {% endif %} &nbsp;
      &nbsp;  
      {% if outputs.merge_status.value != 'CRITICAL' %}   
      🔁 Merge validation : {{ outputs.validate_merge.vars.result }} 
      {{ outputs.validate_merge.vars.detail }}   
      {% endif %} 
      {% if outputs.validate_merge_status.value != 'CRITICAL' %} 
      🔁 Load merge to PostgreSQL : {{ outputs.merge_to_pg.vars.result }} : {{ outputs.merge_to_pg.vars.shape}}  
      {{ outputs.merge_to_pg.vars.detail }}  
      {% endif %} 
      &nbsp;
      

  - id: log_final
    type: io.kestra.plugin.core.log.Log
    description: Final Log
    message: "{{ outputs.final_log_txt.value }}"

