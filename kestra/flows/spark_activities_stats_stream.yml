id: spark_activities_stats_stream
namespace: sds.infra

tasks:
  - id: run_spark_activities_stats
    type: io.kestra.plugin.scripts.python.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands: 
      - |
        docker exec -u root spark-master /opt/spark/bin/spark-submit \
        --conf spark.jars.ivy=/tmp/.ivy2 \
        --conf "spark.driver.extraJavaOptions=-Dlog4j.configuration=file:/opt/spark/conf/log4j.properties" \
        --conf "spark.executor.extraJavaOptions=-Dlog4j.configuration=file:/opt/spark/conf/log4j.properties" \
        --master spark://spark-master:7077 \
        --conf spark.executor.memory=512m \
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.1.0 \
        /opt/spark/scripts/process_activities_stats.py