
id: setup_and_ingest_pipeline
namespace: null

tasks:

# --- PHASE 1 : REDPANDA INITIALISATION ---
  - id: init_redpanda_topics
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
    containerImage: docker.redpanda.com/redpandadata/redpanda:v23.3.9
    
    commands:
      # Topics creation for CDC and Spark
      - rpk topic create cdc.public.employees --brokers redpanda:9092
      - rpk topic create cdc.public.activities --brokers redpanda:9092
      - rpk topic create spark_checkpoints --brokers redpanda:9092

  # --- PHASE 2 : DEBEZIUM INITIALISATION ---
  - id: register_cdc_connector
    type: io.kestra.plugin.core.http.Request
    uri: "http://debezium:8083/connectors"
    method: POST
    contentType: application/json
    body: |
      {
        "name": "postgres-connector",
        "config": {
          "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
          "database.hostname": "postgres",
          "database.port": "5432",
          "database.user": "{{ secret('POSTGRES_USER') }}",
          "database.password": "{{ secret('POSTGRES_PASSWORD') }}",
          "database.dbname": "{{ secret('POSTGRES_DB') }}",
          "database.server.name": "postgres",
          "table.include.list": "public.employees,public.activities",
          "plugin.name": "pgoutput",
          "topic.prefix": "cdc"
        }
      }

    # --- PHASE 3 : STARTING SPARK ---
  - id: start_spark_streaming
    type: io.kestra.plugin.spark.SparkCLI
    containerImage: apache/spark:3.5.3  # On force l'image officielle ici
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
    commands:
      - spark-submit --master spark://spark-master:7077 --packages io.delta:delta-spark_2.12:3.2.0 /opt/spark-apps/process_streaming_data.py

      
  # --- PHASE 4 : DATA INGESTION ---
  - id: ingest_hr_data
    disabled: true
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://postgres:5432/{{ secret('POSTGRES_DB') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      COPY employees FROM '/tmp/Donnees_RH.csv' WITH (FORMAT csv, HEADER true);

# --- PHASE 5 : SPORT HISTORIC GENERATION ---
  - id: generate_sport_history
    disabled: true
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install Faker psycopg2-binary
    script: |
      import psycopg2
      from faker import Faker
      #... Logique Python Faker pour insérer dans PostgreSQL...
