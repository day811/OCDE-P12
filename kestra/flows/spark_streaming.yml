id: spark_streaming
namespace: sds.infra
description: "Job Spark Streaming pour la réconciliation RH/Sport et calcul des avantages"

tasks:
  - id: run_spark_job
    type: io.kestra.plugin.spark.SparkCLI
    containerImage: apache/spark:3.5.3
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
      user: root
    inputFiles:
      process_data.py: |
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import from_json, col, when
        from pyspark.sql.types import StructType, StructField, StringType, IntegerType, FloatType

        # On simplifie l'initialisation car les config sont passées au submit
        spark = SparkSession.builder \
            .appName("SportPipeline-Final") \
            .getOrCreate()

        # Schémas (RH et Sport)
        schema_rh = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id_salarie", IntegerType()),
                    StructField("nom", StringType()),
                    StructField("salaire_brut", FloatType()),
                    StructField("moyen_de_deplacement", StringType())
                ]))
            ]))
        ])

        schema_sport = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id_salarie", IntegerType()),
                    StructField("pratique_sportive", StringType())
                ]))
            ]))
        ])

        # Lecture Kafka (Topics générés par Debezium)
        df_rh = spark.readStream.format("kafka") \
            .option("kafka.bootstrap.servers", "redpanda:9092") \
            .option("subscribe", "cdc.public.employees") \
            .option("startingOffsets", "earliest").load() \
            .select(from_json(col("value").cast("string"), schema_rh).alias("data")).select("data.payload.after.*")

        df_sport = spark.readStream.format("kafka") \
            .option("kafka.bootstrap.servers", "redpanda:9092") \
            .option("subscribe", "cdc.public.sports_activities") \
            .option("startingOffsets", "earliest").load() \
            .select(from_json(col("value").cast("string"), schema_sport).alias("data")).select("data.payload.after.*")

        # Logique métier Prime 5%
        df_final = df_rh.withColumn("prime_eligible", col("moyen_de_deplacement").rlike("(?i)Vélo|Marche|Running")) \
                        .withColumn("montant_prime", when(col("prime_eligible"), col("salaire_brut") * 0.05).otherwise(0))

        # Écriture Delta
        query = df_final.writeStream.format("delta") \
            .outputMode("append") \
            .option("checkpointLocation", "/opt/spark/data/checkpoints/gold_zone") \
            .start("/opt/spark/data/delta/final_stats")

        query.awaitTermination()

    commands:
      - /opt/spark/bin/spark-submit 
        --master spark://spark-master:7077 
        --conf "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension" 
        --conf "spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
        --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3 
        process_data.py