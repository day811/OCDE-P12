id: spark_streaming
namespace: sds.infra
description: "Job Spark Streaming pour la réconciliation RH/Sport et calcul des avantages"

tasks:
  - id: run_spark_job
    type: io.kestra.plugin.spark.SparkCLI
    containerImage: apache/spark:3.5.3
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "ocde-p12_sport-pipeline"
    inputFiles:
      process_data.py: |
        from pyspark.sql import SparkSession
        from pyspark.sql.functions import from_json, col, expr, when
        from pyspark.sql.types import StructType, StructField, StringType, IntegerType, FloatType

        # 1. Initialisation Spark avec support Delta et Kafka
        spark = SparkSession.builder \
            .appName("SportPipeline-FinalLogic") \
            .config("spark.sql.extensions", "io.delta.sql.DeltaSparkSessionExtension") \
            .config("spark.sql.catalog.spark_catalog", "org.apache.spark.sql.delta.catalog.DeltaCatalog") \
            .getOrCreate()

        # 2. Schémas basés sur les fichiers CSV fournis
        schema_rh = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id_salarie", IntegerType()),
                    StructField("nom", StringType()),
                    StructField("prenom", StringType()),
                    StructField("salaire_brut", FloatType()),
                    StructField("moyen_de_deplacement", StringType())
                ]))
            ]))
        ])

        schema_sport = StructType([
            StructField("payload", StructType([
                StructField("after", StructType([
                    StructField("id_salarie", IntegerType()),
                    StructField("pratique_sportive", StringType())
                ]))
            ]))
        ])

        # 3. Lecture des flux Redpanda
        def read_cdc_topic(topic):
            return spark.readStream \
                .format("kafka") \
                .option("kafka.bootstrap.servers", "redpanda:9092") \
                .option("subscribe", topic) \
                .option("startingOffsets", "earliest") \
                .load()

        df_rh_raw = read_cdc_topic("cdc.public.employees")
        df_sport_raw = read_cdc_topic("cdc.public.sports_activities")

        # 4. Parsing et Nettoyage
        df_rh = df_rh_raw.select(from_json(col("value").cast("string"), schema_rh).alias("data")).select("data.payload.after.*")
        df_sport = df_sport_raw.select(from_json(col("value").cast("string"), schema_sport).alias("data")).select("data.payload.after.*")

        # 5. Application des règles métier (Note de Cadrage)
        # Règle 1 : Prime 5% si déplacement "Sportif" (Vélo, Marche, etc.)
        df_rh_processed = df_rh.withColumn("is_eligible_prime", 
            col("moyen_de_deplacement").rlike("(?i)Vélo|Marche|Running|Trottinette")) \
            .withColumn("montant_prime_annuelle", 
                when(col("is_eligible_prime"), col("salaire_brut") * 0.05).otherwise(0))

        # Règle 2 : Jointure pour les journées Bien-être (15 activités min)
        # Note: Dans un vrai flux streaming, on utiliserait des watermarks pour les jointures complexes.
        # Ici on fait une jointure simple pour le POC.
        df_final = df_rh_processed.join(df_sport, "id_salarie", "left")

        # 6. Écriture vers Delta Lake (Couche Gold)
        query = df_final.writeStream \
            .format("delta") \
            .outputMode("append") \
            .option("checkpointLocation", "/opt/spark/data/checkpoints/analytics_gold") \
            .start("/opt/spark/data/delta/employees_benefits_stats")

        query.awaitTermination()

    commands:
      - /opt/spark/bin/spark-submit 
        --master spark://spark-master:7077 
        --conf "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension" 
        --conf "spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
        --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3 
        process_data.py