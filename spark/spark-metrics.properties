# Configuration Prometheus SIMPLIFIÉE
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# Sinks de base Spark (obligatoires)
*.sink.console.class=org.apache.spark.metrics.sink.ConsoleSink
*.sink.console.period=10seconds

# Ports différents pour éviter conflits
master.sink.prometheusServlet.port=8080
worker.sink.prometheusServlet.port=8081