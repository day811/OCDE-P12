global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Job Redpanda (Indispensable pour le dashboard 18135)
  - job_name: 'redpanda'
    metrics_path: '/public_metrics'
    static_configs:
      - targets: ['redpanda:9644']

  # 2. Job Kestra
  - job_name: 'kestra'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kestra:8081']

  # 3. Job Spark (Générique)
  - job_name: 'spark'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['spark-master:8080', 'spark-worker:8081']

  # 4. Job Spark-Master (Spécifique)
  - job_name: 'spark-master'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['spark-master:8080']

  # 5. Job Spark-Worker (Spécifique)
  - job_name: 'spark-worker'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['spark-worker:8081']