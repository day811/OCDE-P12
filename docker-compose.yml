networks:
  sport-pipeline:
    driver: bridge

volumes:
  postgres_data:
  kestra_storage:
  redpanda_data:

services:
  # Unique Database for application and Kestra metadata
  postgres:
    image: debezium/postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium Requirement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - sport-pipeline

  # Kestra with PostgreSQL persistency
  kestra:
    image: kestra/kestra:latest-full
    container_name: kestra
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basicAuth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          datasources:
            postgres:
              driverClassName: org.postgresql.Driver
              url: jdbc:postgresql://postgres:5432/kestra_metadata
              username: ${KESTRA_DB_USER}
              password: ${KESTRA_DB_PASSWORD}
    command: server standalone
    volumes:
      - kestra_storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - sport-pipeline

    
  # Message bus for Redpanda 
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.9
    container_name: redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_PORT}:19092"
    healthcheck:
      test: ["CMD", "rpk", "topic", "list"]
      interval: 15s
      retries: 5
    networks:
      - sport-pipeline

  # CDC Debezium Connector
  debezium:
    image: debezium/connect:2.4
    container_name: debezium
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "${DEBEZIUM_PORT}:8083"
    networks:
      - sport-pipeline

  # Spark Master - OFFICIEL APACHE
  spark-master:
    image: apache/spark:3.5.3  # Official stable Image 
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./delta-lake:/opt/spark/data  # Delta Lake storage
    ports:
      - "8080:8080"  # Spark UI
      - "7077:7077"  # Master URL
    networks:
      - sport-pipeline
    command: /opt/spark/sbin/start-master.sh

  # Spark Worker
  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - ./delta-lake:/opt/spark/data
    networks:
      - sport-pipeline
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077